services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      target: production
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      LDRAW_LIBRARY_ROOT: ${LDRAW_LIBRARY_ROOT:-/data/ldraw/official}
      LDRAW_LIBRARY_URL: ${LDRAW_LIBRARY_URL:-https://library.ldraw.org/library/updates/complete.zip}
      MODEL_STORAGE_ROOT: ${MODEL_STORAGE_ROOT:-/data/models}
      MODEL_MAX_UPLOAD_BYTES: ${MODEL_MAX_UPLOAD_BYTES:-26214400}
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
      - --no-server-header
    volumes:
      - ${LDRAW_DATA_PATH:-./data/ldraw}:/data/ldraw
      - ${MODEL_DATA_PATH:-./data/models}:/data/models
      - ./data/backups:/data/backups
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: production
    environment:
      NGINX_UPLOAD_LIMIT: ${NGINX_UPLOAD_LIMIT:-26m}
    ports:
      - "127.0.0.1:${PROD_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
