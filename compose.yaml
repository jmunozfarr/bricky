services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
      LDRAW_LIBRARY_ROOT: ${LDRAW_LIBRARY_ROOT:-/data/ldraw/official}
      LDRAW_LIBRARY_URL: ${LDRAW_LIBRARY_URL:-https://library.ldraw.org/library/updates/complete.zip}
      MODEL_STORAGE_ROOT: ${MODEL_STORAGE_ROOT:-/data/models}
      MODEL_MAX_UPLOAD_BYTES: ${MODEL_MAX_UPLOAD_BYTES:-26214400}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/app
      - ./data/ldraw:/data/ldraw
      - ./data/models:/data/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  web_node_modules:
