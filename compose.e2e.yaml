services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_started
    profiles: [test]
    command: npm run test:e2e
