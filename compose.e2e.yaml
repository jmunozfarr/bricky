services:
  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      web:
        condition: service_started
    profiles: [test]
    command: npm run test:e2e

  thumbnails:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
      THUMBNAILS_OUT: /thumbnails
      HOME: /tmp
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - ./data/thumbnails:/thumbnails
    depends_on:
      web:
        condition: service_started
    profiles: [tools]
    entrypoint: ["node", "scripts/render-thumbnails.mjs"]
