# Quality tooling configuration for the Bricky API. The service is not an
# installable distribution; dependencies stay in requirements.in/.lock.

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort import ordering
    "B",   # bugbear correctness checks
    "C4",  # comprehension cleanups
    "UP",  # pyupgrade modernizations
    "SIM", # simplifications
    "RUF", # ruff-specific checks
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency defaults are intentional call-in-default patterns.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[tool.pydantic-mypy]
init_forbid_extra = true
